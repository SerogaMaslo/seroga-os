# Seroga OS ielādes izvēlne (USB / DVD)

set default=0
set timeout=8
set timeout_style=menu

if loadfont ($root)/boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=auto
  set gfxpayload=keep
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

menuentry "Palaist Seroga OS" {
  set gfxpayload=keep
  linux  /casper/vmlinuz boot=casper quiet splash locale=lv_LV.UTF-8 keyboard-configuration/layoutcode=lv,us timezone=Europe/Riga ---
  initrd /casper/initrd
}

menuentry "Palaist Seroga OS (drošais grafikas režīms)" {
  set gfxpayload=keep
  linux  /casper/vmlinuz boot=casper nomodeset locale=lv_LV.UTF-8 keyboard-configuration/layoutcode=lv,us timezone=Europe/Riga ---
  initrd /casper/initrd
}

menuentry "Palaist Seroga OS (English)" {
  set gfxpayload=keep
  linux  /casper/vmlinuz boot=casper quiet splash locale=en_US.UTF-8 ---
  initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI iestatījumi (BIOS)" {
    fwsetup
  }
fi

menuentry "Restartēt datoru" {
  reboot
}
