# ============================================================
#  Seroga OS — iebūvēto lietotņu saraksts
# ============================================================
#  Formāts (atdalītājs |):
#    id | Nosaukums | GitHub repo | Apraksts | Ikona
#
#  Lietotne tiek paņemta no repo jaunākā GitHub Release.
#  Automātiski atpazīst (šādā secībā):
#    1) .deb fails (amd64 / x86_64)
#    2) .AppImage fails
#    3) Flutter Linux bundle: .tar.gz vai .zip ar "linux" nosaukumā
#
#  Ja repo vai release vēl nav — lietotne tiek izlaista, būvēšana turpinās.
#  ⚠ Pārbaudi, vai repo nosaukumi sakrīt ar taviem GitHub repozitorijiem!
#  Ikona: freedesktop ikonas nosaukums VAI ceļš uz failu bundle iekšā (piem. data/flutter_assets/assets/icon.png)
# ============================================================

