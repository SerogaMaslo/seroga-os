name: Būvēt Seroga OS ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Katru svētdienu jauns ISO ar svaigākajiem Ubuntu atjauninājumiem un tavām lietotnēm
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: seroga-os-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Atbrīvot vietu diskā
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Lejupielādēt kodu
        uses: actions/checkout@v4

      - name: Būvēt ISO (Ubuntu 26.04 konteinerā)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --privileged \
            -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
            -v "$PWD":/build -w /build \
            ubuntu:26.04 bash ./build.sh

      - name: Sagatavot failus augšupielādei
        id: prep
        run: |
          sudo chown -R "$USER" out
          sudo rm -rf work
          cd out
          ISO=$(ls *.iso)
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"
          # GitHub Release fails var būt max 2 GB — lielāku ISO sadala daļās
          SIZE=$(stat -c%s "$ISO")
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1900M -d "$ISO" "$ISO.part"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh

      - name: Publicēt GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jaunakais' }}
          name: Seroga OS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jaunākais' }}
          body: |
            Seroga OS ${{ github.ref_name }} — uz Ubuntu 26.04 LTS bāzes, KDE Plasma, Windows stila darbvirsma.

            **Kā ierakstīt USB:** lejupielādē ISO un ieraksti ar Rufus (Windows) vai balenaEtcher.
            Ja ISO ir sadalīts daļās (`.part00`, `.part01`…), vispirms tās savieno:
            - Windows: `copy /b seroga-os-*.iso.part00 + seroga-os-*.iso.part01 seroga-os.iso`
            - Linux: `cat seroga-os-*.iso.part* > seroga-os.iso`
          files: |
            ${{ steps.prep.outputs.split == 'true' && 'out/*.part*' || 'out/*.iso' }}
            out/SHA256SUMS
